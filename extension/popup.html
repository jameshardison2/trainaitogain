<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 24px;
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f172a; /* Brand dark bg */
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #10b981; /* Brand Primary Green */
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-top: 0;
      margin-bottom: 24px;
    }
    
    /* Toggle Switch UI */
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .toggle-label {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155; 
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #10b981; 
      box-shadow: 0 0 12px rgba(16,185,129,0.4);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .link {
      display: block;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    .link:hover { 
      background: rgba(16, 185, 129, 0.2); 
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon48.png" alt="Logo">
    <h2>The Invisible Advantage</h2>
  </div>
  <p><strong>Stealth Mode is Active.</strong></p>
  <p style="color:#94a3b8; font-size:13px;">This extension runs completely invisibly in the background. It will automatically slide into view when you are viewing a Job Posting or typing in a text box on Mercor.</p>
  
  <div class="toggle-container">
    <div class="toggle-label">Master Switch</div>
    <label class="switch">
      <input type="checkbox" id="master-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <a href="https://trainaitogain-50c19.web.app/" target="_blank" class="link">Visit Dashboard</a>
  
  <script src="popup.js"></script>
</body>
</html>
