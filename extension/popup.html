<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 24px;
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: white;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #10b981, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    
    /* Toggle Switch UI */
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .toggle-label {
      font-size: 14px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .link {
      display: block;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .link:hover { background: rgba(255, 255, 255, 0.1); color: white; }
  </style>
</head>
<body>
  <h2>TrainAIToGain Hub</h2>
  <p>Your professional assistant for Mercor applications.</p>
  
  <div class="toggle-container">
    <div class="toggle-label">Master Switch</div>
    <label class="switch">
      <input type="checkbox" id="master-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <a href="https://trainaitogain.com" target="_blank" class="link">Visit TrainAIToGain.com</a>
  
  <script src="popup.js"></script>
</body>
</html>
